name: CI

# Tests the module against the core version in core-ref (the one it requires, see min_core in
# module.json), on every push and pull request, and every Monday.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  module:
    uses: Gamemode-Invasor/invasor/.github/workflows/module.yml@main
    with:
      core-ref: v0.2.0
    secrets: inherit
